name: Update flake inputs

on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Waiting on the PR's checks
  checks: read
  pull-requests: read

jobs:
  update:
    runs-on: ubuntu-latest
    # Main-only environment holding the teleotrope app's credentials
    environment: update
    env:
      BOT_NAME: teleotrope[bot]
      # The bot account's user ID, not the app ID
      BOT_EMAIL: 347049929+teleotrope[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup git identity
        run: |
          git config --global user.email "$BOT_EMAIL"
          git config --global user.name "$BOT_NAME"
      - name: Update
        run: nix flake update --commit-lock-file
      - name: Get update details
        id: update-details
        run: |
          body=$(git log -1 --pretty=%B)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # An app token, unlike GITHUB_TOKEN, starts CI on the PR it opens, and
      # the app can skip the approval rule so the PR auto-merges once CI passes.
      # Scoped to this repository by default.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.UPDATER_PRIVATE_KEY }}
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: create-pr
        with:
          branch: gh/update-flake
          title: "chore: update flake inputs"
          body: ${{ steps.update-details.outputs.body }}
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ env.BOT_NAME }} <${{ env.BOT_EMAIL }}>
          committer: ${{ env.BOT_NAME }} <${{ env.BOT_EMAIL }}>
      # Auto-merge waits for the approval the app may skip, so wait for the
      # required checks here and merge directly. The app can skip only the
      # approval ruleset; "Require CI" still applies to the merge.
      - if: ${{ steps.create-pr.outputs.pull-request-number }}
        name: Wait for required checks
        run: |
          # gh exits 1 until the checks are reported, 8 while they're pending
          for _ in $(seq 20); do
            rc=0
            gh pr checks "$PR" --required >/dev/null 2>&1 || rc=$?
            [ "$rc" -eq 0 ] || [ "$rc" -eq 8 ] && break
            sleep 15
          done
          gh pr checks "$PR" --required --watch --fail-fast --interval 30
        env:
          # The app has no Checks permission; the job's token reads them
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.create-pr.outputs.pull-request-number }}
      - if: ${{ steps.create-pr.outputs.pull-request-number }}
        name: Merge
        run: gh pr merge "$PR" --squash --match-head-commit "$SHA"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.create-pr.outputs.pull-request-number }}
          SHA: ${{ steps.create-pr.outputs.pull-request-head-sha }}
