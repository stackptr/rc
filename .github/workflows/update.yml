name: Update flake inputs

on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    # Main-only environment holding the teleotrope app's credentials
    environment: update
    env:
      BOT_NAME: teleotrope[bot]
      # The bot account's user ID, not the app ID
      BOT_EMAIL: 347049929+teleotrope[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup git identity
        run: |
          git config --global user.email "$BOT_EMAIL"
          git config --global user.name "$BOT_NAME"
      - name: Update
        run: nix flake update --commit-lock-file
      - name: Get update details
        id: update-details
        run: |
          body=$(git log -1 --pretty=%B)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # An app token, unlike GITHUB_TOKEN, starts CI on the PR it opens, and
      # the app can skip the approval rule so the PR auto-merges once CI passes.
      # Scoped to this repository by default.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.UPDATER_PRIVATE_KEY }}
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: create-pr
        with:
          branch: gh/update-flake
          title: "chore: update flake inputs"
          body: ${{ steps.update-details.outputs.body }}
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ env.BOT_NAME }} <${{ env.BOT_EMAIL }}>
          committer: ${{ env.BOT_NAME }} <${{ env.BOT_EMAIL }}>
      - if: ${{ steps.create-pr.outputs.pull-request-number }}
        name: Enable auto-merge after requirements met
        run: gh pr merge --squash --auto "${{ steps.create-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}