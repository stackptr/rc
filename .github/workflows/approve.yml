name: Approve my PRs

# Approves PRs I author as the teleoid app, so they can auto-merge once CI
# passes; I can't approve my own PRs, and the "Require approval" ruleset
# applies to them. Agents' PRs (teleomycete) and forks never match.
#
# The job is stackptr/actions's reusable approve.yml, shared by every repo the
# agents work on. It reads teleoid's credentials from this repo's main-only
# `approve` environment. pull_request_target runs this file from main, not
# from the PR, so a PR can't change what it calls.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  approve:
    uses: stackptr/actions/.github/workflows/approve.yml@61b09980127796ed52936b6372b6701a0409099d # v1.1.0
    # A reusable workflow's `secrets` holds only what the caller passes, even
    # for a job that declares an environment: without this, the `approve`
    # environment's APPROVER_PRIVATE_KEY arrives empty. It also passes any
    # repository-level secrets, of which rc has none.
    secrets: inherit
