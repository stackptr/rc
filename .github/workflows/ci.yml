name: CI

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    # The flake's formatter runs every pre-commit hook (alejandra, statix,
    # nil) on all files, and fails if a hook fails or rewrites a file.
    - name: Check formatting and lints
      run: |
        if ! nix fmt; then
          git --no-pager diff
          exit 1
        fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: glyph
            system: x86_64-linux
            runner: ubuntu-latest
          - host: Rhizome
            system: aarch64-darwin
            runner: macos-latest
          - host: Stroma
            system: aarch64-darwin
            runner: macos-latest
          - host: lobtop
            system: aarch64-darwin
            runner: macos-latest
          - host: spore
            system: x86_64-linux
            runner: ubuntu-latest
          - host: zeta
            system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          extra-substituters = https://cache.zx.dev/main
          extra-trusted-public-keys = main:mu0jkxdJTGWC3djDSEQb3rvZgqlhA8WVMulcTo5IW6c=
    - name: Evaluate system configuration
      id: eval
      env:
        HOST: ${{ matrix.host }}
        SYSTEM: ${{ matrix.system }}
      run: |
        if [ "$SYSTEM" = "aarch64-darwin" ]; then
          attr=".#darwinConfigurations.$HOST.system"
        else
          attr=".#nixosConfigurations.$HOST.config.system.build.toplevel"
        fi
        rc=0
        drv=$(nix eval --raw "$attr.drvPath" 2>eval.log) || rc=$?
        cat eval.log
        if grep -q "evaluation warning:" eval.log; then
          encoded=$(python3 -c "import sys; print(sys.stdin.read().replace('%','%25').replace('\n','%0A').replace('\r','%0D'))" < eval.log)
          echo "::warning title=Evaluation warnings ($HOST)::${encoded}"
        fi
        echo "drv=$drv" >> "$GITHUB_OUTPUT"
        exit $rc
    - name: Configure Attic cache
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      run: |
        nix profile install --inputs-from . attic#attic-client --fallback
        attic login rc https://cache.zx.dev "$ATTIC_TOKEN"
        attic use rc:main
    - name: Allow unprivileged user namespaces (needed by bubblewrap-based FHS builds)
      if: runner.os == 'Linux'
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Build system configuration
      env:
        DRV: ${{ steps.eval.outputs.drv }}
      run: nix build "$DRV^*"
    - name: Push to Attic
      if: github.ref == 'refs/heads/main'
      run: |
        attic push rc:main ./result
        attic push rc:main $(which attic)
        nix build .#devShells.${{ matrix.system }}.default -o ./result-devshell
        attic push rc:main ./result-devshell

  # One Slack message per failed run, naming every failed job.
  notify:
    needs: [lint, build]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
    - name: Collect failed jobs
      id: failed
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
          --jq '[.jobs[] | select(.conclusion == "failure") | .name | sub("^build \\((?<h>[^,]+),.*"; "\(.h)")] | join(", ")')
        echo "jobs=${jobs:-unknown}" >> "$GITHUB_OUTPUT"
    - name: Prepare Slack context
      id: slack-context
      env:
        EVENT_NAME: ${{ github.event_name }}
        SHA: ${{ github.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        COMMIT_URL: ${{ github.event.head_commit.url }}
      run: |
        echo "short_sha=${SHA:0:7}" >> $GITHUB_OUTPUT
        if [ "$EVENT_NAME" = "pull_request" ]; then
          echo "trigger=PR <${PR_URL}|#${PR_NUMBER}: ${PR_TITLE}>" >> $GITHUB_OUTPUT
        else
          FIRST_LINE=$(printf '%s' "$COMMIT_MESSAGE" | head -1)
          echo "trigger=push <${COMMIT_URL}|${FIRST_LINE}>" >> $GITHUB_OUTPUT
        fi
    - name: Notify Slack on failure
      uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_UPDATES_CI }}
        webhook-type: incoming-webhook
        payload-templating: true
        payload: |
          {
            "attachments": [
              {
                "color": "#CC0000",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": ":x: CI failed",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Failed*\n${{ steps.failed.outputs.jobs }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Trigger*\n${{ steps.slack-context.outputs.trigger }}"
                      }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> · <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ steps.slack-context.outputs.short_sha }}> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                      }
                    ]
                  }
                ]
              }
            ]
          }
