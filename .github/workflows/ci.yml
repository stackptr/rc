name: CI

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    # The flake's formatter runs every pre-commit hook (alejandra, statix,
    # nil) on all files, and fails if a hook fails or rewrites a file.
    - name: Check formatting and lints
      run: |
        if ! nix fmt; then
          git --no-pager diff
          exit 1
        fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: glyph
            system: x86_64-linux
            runner: ubuntu-latest
          - host: Rhizome
            system: aarch64-darwin
            runner: macos-latest
          - host: Stroma
            system: aarch64-darwin
            runner: macos-latest
          - host: lobtop
            system: aarch64-darwin
            runner: macos-latest
          - host: spore
            system: x86_64-linux
            runner: ubuntu-latest
          - host: zeta
            system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          extra-substituters = https://cache.zx.dev/main
          extra-trusted-public-keys = main:mu0jkxdJTGWC3djDSEQb3rvZgqlhA8WVMulcTo5IW6c=
    - name: Evaluate system configuration
      id: eval
      env:
        HOST: ${{ matrix.host }}
        SYSTEM: ${{ matrix.system }}
      run: |
        if [ "$SYSTEM" = "aarch64-darwin" ]; then
          attr=".#darwinConfigurations.$HOST.system"
        else
          attr=".#nixosConfigurations.$HOST.config.system.build.toplevel"
        fi
        rc=0
        drv=$(nix eval --raw "$attr.drvPath" 2>eval.log) || rc=$?
        cat eval.log
        if grep -q "evaluation warning:" eval.log; then
          encoded=$(python3 -c "import sys; print(sys.stdin.read().replace('%','%25').replace('\n','%0A').replace('\r','%0D'))" < eval.log)
          echo "::warning title=Evaluation warnings ($HOST)::${encoded}"
        fi
        echo "drv=$drv" >> "$GITHUB_OUTPUT"
        exit $rc
    - name: Configure Attic cache
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      run: |
        nix profile install --inputs-from . attic#attic-client --fallback
        attic login rc https://cache.zx.dev "$ATTIC_TOKEN"
        attic use rc:main
    - name: Allow unprivileged user namespaces (needed by bubblewrap-based FHS builds)
      if: runner.os == 'Linux'
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Build system configuration
      env:
        DRV: ${{ steps.eval.outputs.drv }}
      run: nix build "$DRV^*"
    - name: Push to Attic
      if: github.ref == 'refs/heads/main'
      run: |
        attic push rc:main ./result
        attic push rc:main $(which attic)
        nix build .#devShells.${{ matrix.system }}.default -o ./result-devshell
        attic push rc:main ./result-devshell

  # One Slack message per failed run, naming every failed job.
  notify:
    needs: [lint, build]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
    - uses: stackptr/actions/slack-notify@b165abf73542f37725926c8e2ba3ad26942ed1eb # feat-slack-notify-action, re-pin to v1.0.0
      with:
        token: ${{ secrets.SLACK_BOT_TOKEN }}
        channel: "#alerts"
        status: failure
        failed-jobs: true
