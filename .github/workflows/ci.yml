name: CI

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    # The flake's formatter runs every pre-commit hook (alejandra, statix,
    # nil) on all files, and fails if a hook fails or rewrites a file.
    - name: Check formatting and lints
      run: |
        if ! nix fmt; then
          git --no-pager diff
          exit 1
        fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: glyph
            system: x86_64-linux
            runner: ubuntu-latest
          - host: Rhizome
            system: aarch64-darwin
            runner: macos-latest
          - host: Stroma
            system: aarch64-darwin
            runner: macos-latest
          - host: lobtop
            system: aarch64-darwin
            runner: macos-latest
          - host: spore
            system: x86_64-linux
            runner: ubuntu-latest
          - host: zeta
            system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          extra-substituters = https://cache.zx.dev/main
          extra-trusted-public-keys = main:mu0jkxdJTGWC3djDSEQb3rvZgqlhA8WVMulcTo5IW6c=
    - name: Evaluate system configuration
      id: eval
      env:
        HOST: ${{ matrix.host }}
        SYSTEM: ${{ matrix.system }}
      run: |
        if [ "$SYSTEM" = "aarch64-darwin" ]; then
          attr=".#darwinConfigurations.$HOST.system"
        else
          attr=".#nixosConfigurations.$HOST.config.system.build.toplevel"
        fi
        rc=0
        drv=$(nix eval --raw "$attr.drvPath" 2>eval.log) || rc=$?
        cat eval.log
        if grep -q "evaluation warning:" eval.log; then
          encoded=$(python3 -c "import sys; print(sys.stdin.read().replace('%','%25').replace('\n','%0A').replace('\r','%0D'))" < eval.log)
          echo "::warning title=Evaluation warnings ($HOST)::${encoded}"
        fi
        echo "drv=$drv" >> "$GITHUB_OUTPUT"
        exit $rc
    - name: Allow unprivileged user namespaces (needed by bubblewrap-based FHS builds)
      if: runner.os == 'Linux'
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Build system configuration
      env:
        DRV: ${{ steps.eval.outputs.drv }}
      run: nix build "$DRV^*"
    # Only main gets ATTIC_TOKEN, and only after everything is built: branch
    # and PR builds read the public cache through extra-substituters above,
    # and no branch code (a lock file pointing attic elsewhere, or an
    # unsandboxed derivation on the macOS runners) runs with the token
    # around. The client comes from a fixed rev, not the flake's lock, so a
    # lock change can't swap it either; bump it by hand.
    - name: Push to Attic
      if: github.ref == 'refs/heads/main'
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      run: |
        nix build .#devShells.${{ matrix.system }}.default -o ./result-devshell
        nix profile install github:zhaofengli/attic/7a19204df10d606c5070e6bb72615c3461900c05#attic-client --fallback
        attic login rc https://cache.zx.dev "$ATTIC_TOKEN"
        attic push rc:main ./result
        attic push rc:main "$(which attic)"
        attic push rc:main ./result-devshell

  # One Slack message per failed run, naming every failed job.
  notify:
    needs: [lint, build]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
    - uses: stackptr/actions/slack-notify@8f86bf2d6b69d2225bee5726b080fc6ce1066bd9 # v1.0.0
      with:
        token: ${{ secrets.SLACK_BOT_TOKEN }}
        channel: "#alerts"
        status: failure
        failed-jobs: true
