name: Deploy
run-name: >-
  deploy${{ inputs.glyph && ' glyph' || '' }}${{ (inputs.spore || github.event_name == 'schedule') && ' spore' || '' }}${{ inputs.zeta && ' zeta' || '' }}${{ github.event_name == 'schedule' && ' (scheduled)' || '' }}

on:
  # spore faces the internet, so it shouldn't wait on a manual deploy for
  # security fixes: deploy main to it daily, a few hours after the Update
  # workflow's PR usually merges (about 13:00 UTC), at 09:00 PST / 10:00
  # PDT, when I'm likely around to see what it posts to #updates. Skipped
  # when CI's spore build hasn't passed on main or spore already runs main.
  schedule:
    - cron: "0 17 * * *"
  # By hand, or from Request deploys after CI passes on main, for each host
  # whose system changed; spore only for a push of mine (request-deploys.yml)
  workflow_dispatch:
    inputs:
      glyph:
        description: glyph
        type: boolean
        default: false
      spore:
        description: spore
        type: boolean
        default: false
      zeta:
        description: zeta
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # Built and pushed to Attic by CI's spore build, so the deploy
      # substitutes rather than builds, and a commit whose spore build fails
      # never deploys unattended. Only that job counts: the macOS builds can
      # be cancelled for want of a runner, which says nothing about spore.
      - name: Check spore's CI build passed on main
        id: ci
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
            --event push --limit 1 --json databaseId --jq '.[0].databaseId // ""')
          conclusion=""
          if [[ -n $run ]]; then
            # The latest attempt, so re-running failed jobs counts
            view=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json status,jobs)
            conclusion=$(jq -r '[.jobs[] | select(.name | startswith("build (spore,"))][0].conclusion // ""' <<< "$view")
            # A finished run with no spore build means the job was renamed:
            # fail, so it alerts, rather than skip every day
            if [[ $(jq -r .status <<< "$view") == completed && -z $conclusion ]]; then
              echo "::error::CI run $run on $SHA has no 'build (spore, ...)' job"
              exit 1
            fi
          fi
          if [[ "$conclusion" != success ]]; then
            echo "::notice::Skipping the scheduled deploy: spore's CI build on $SHA is '${conclusion:-not finished}'"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - id: set-matrix
        if: steps.ci.outputs.skip != 'true'
        env:
          SELECTED: ${{ github.event_name == 'schedule' && '{"spore":true}' || toJSON(inputs) }}
        run: |
          include=$(jq -nc --argjson sel "$SELECTED" '
            [ {host: "glyph", runner: "ubuntu-latest"},
              {host: "spore", runner: "ubuntu-latest"},
              {host: "zeta", runner: "ubuntu-24.04-arm"} ]
            | map(select($sel[.host] == true))')
          if [[ "$include" == "[]" ]]; then
            echo "::error::Select at least one host to deploy"
            exit 1
          fi
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  # A newer deploy of a host replaces an older one still waiting for my
  # approval: cancel older runs whose waiting deploys are all for hosts this
  # run deploys too. Rejecting takes a required reviewer (me); cancelling has
  # the same effect. A run with a deploy in progress is left alone, and this
  # run's deploy queues behind it in the host's concurrency group. Every
  # request deploys main's head, so the newer run carries the older's changes.
  supersede:
    needs: plan
    if: needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel superseded runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RUN_ID: ${{ github.run_id }}
        run: |
          hosts=$(jq -c '[.include[].host]' <<< "$MATRIX")
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?status=waiting&per_page=50" \
            --jq '.workflow_runs[].id')
          for id in $runs; do
            (( id < RUN_ID )) || continue
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '.jobs')
            waiting=$(jq -c '[.[] | select(.status == "waiting") | .name | capture("^deploy \\((?<h>[^,]+),").h]' <<< "$jobs")
            deploying=$(jq '[.[] | select(.status == "in_progress" and (.name | startswith("deploy (")))] | length' <<< "$jobs")
            if [[ $deploying == 0 ]] && jq -e --argjson new "$hosts" \
              'length > 0 and all(.[]; . as $h | $new | index($h) != null)' <<< "$waiting" > /dev/null; then
              echo "::notice::Cancelling run $id: this run supersedes its waiting deploys of $(jq -r 'join(", ")' <<< "$waiting")"
              gh run cancel "$id" -R "$GITHUB_REPOSITORY"
            fi
          done

  deploy:
    needs: plan
    if: needs.plan.outputs.matrix != ''
    concurrency:
      group: deploy-${{ matrix.host }}
      cancel-in-progress: false
    environment: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The cache is public, so deploys substitute from it without a token
      # (and never push to it).
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.zx.dev/main
            extra-trusted-public-keys = main:mu0jkxdJTGWC3djDSEQb3rvZgqlhA8WVMulcTo5IW6c=

      # Tailnet Lock rejects nodes an OAuth client creates, so the runner joins
      # with a reusable, ephemeral tag:ci auth key signed on a signing node
      # (`tailscale lock sign`). The key expires within 90 days; zeta's
      # tailscale-key-expiry warns 14 days ahead. statedir holds the tailnet
      # key authority state the lock needs.
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          statedir: ${{ runner.temp }}/tailscale

      # Host keys come from hosts/<host>/key.pub (the same keys agenix uses),
      # so the runner never trusts a key it sees for the first time.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for h in glyph spore zeta; do
            echo "$h $(head -1 "hosts/$h/key.pub")"
          done > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host glyph spore zeta
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
          EOF

      # nixos-version reports the flake revision the host runs
      - name: Check deployed revision
        id: current
        if: github.event_name == 'schedule'
        env:
          HOST: ${{ matrix.host }}
          SHA: ${{ github.sha }}
        run: |
          deployed=$(ssh "$HOST" nixos-version --configuration-revision)
          if [[ "$deployed" == "$SHA" ]]; then
            echo "::notice::$HOST already runs $SHA"
            echo "up-to-date=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to ${{ matrix.host }}
        id: deploy
        if: steps.current.outputs.up-to-date != 'true'
        run: |
          set -o pipefail
          nix run --inputs-from . deploy-rs -- \
            .#${{ matrix.host }} \
            --skip-checks 2>&1 | tee deploy.log

      # Write the deploy-rs output into the target's journal, where Alloy
      # ships it to Loki as {host="<host>", app="deploy-rs"}. Done after the
      # deploy, not streamed, so a dropped SSH session during activation
      # can't break the deploy. The summary line is err on failure, so
      # failed deploys match {priority=~"[0-3]"}. Substitution noise
      # ("copying path ..." and the indented store path lists, over 95% of
      # the output) stays in the Actions log only.
      - name: Ship deploy log to Loki
        if: always() && steps.deploy.outcome != 'skipped'
        continue-on-error: true
        env:
          HOST: ${{ matrix.host }}
          OUTCOME: ${{ steps.deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVISION: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          priority=info
          [[ "$OUTCOME" == success ]] || priority=err
          if [[ -s deploy.log ]]; then
            sed -e 's/\x1b\[[0-9;]*m//g' -e '/^copying path /d' -e '/^  \/nix\/store\//d' deploy.log \
              | ssh "$HOST" systemd-cat -t deploy-rs -p info
          fi
          echo "deploy ${OUTCOME}: revision=${REVISION} actor=${ACTOR} run=${RUN_URL}" \
            | ssh "$HOST" systemd-cat -t deploy-rs -p "$priority"

  # Nobody is watching a scheduled run, so post its failures
  notify:
    needs: [plan, deploy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # SLACK_BOT_TOKEN is in the main-only `notify` environment
    environment: notify
    permissions:
      actions: read
    steps:
      - uses: stackptr/actions/slack-notify@8f86bf2d6b69d2225bee5726b080fc6ce1066bd9 # v1.0.0
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: "#alerts"
          status: failure
          failed-jobs: true
