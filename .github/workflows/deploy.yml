name: Deploy
run-name: deploy ${{ inputs.hosts }}

on:
  workflow_dispatch:
    inputs:
      hosts:
        description: "Hosts to deploy"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - glyph
          - spore
          - zeta

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          HOST: ${{ inputs.hosts }}
        run: |
          include=$(jq -nc --arg h "$HOST" '
            [ {host: "glyph", runner: "ubuntu-latest"},
              {host: "spore", runner: "ubuntu-latest"},
              {host: "zeta", runner: "ubuntu-24.04-arm"} ]
            | map(select($h == "all" or .host == $h))')
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    concurrency:
      group: deploy-${{ matrix.host }}
      cancel-in-progress: false
    environment: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.zx.dev/main
            extra-trusted-public-keys = main:mu0jkxdJTGWC3djDSEQb3rvZgqlhA8WVMulcTo5IW6c=

      - name: Configure Attic cache
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix profile install --inputs-from . attic#attic-client --fallback
          attic login rc https://cache.zx.dev "$ATTIC_TOKEN"
          attic use rc:main

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Host keys come from hosts/<host>/key.pub (the same keys agenix uses),
      # so the runner never trusts a key it sees for the first time.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for h in glyph spore zeta; do
            echo "$h $(head -1 "hosts/$h/key.pub")"
          done > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host glyph spore zeta
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
          EOF

      - name: Deploy to ${{ matrix.host }}
        id: deploy
        run: |
          set -o pipefail
          nix run --inputs-from . deploy-rs -- \
            .#${{ matrix.host }} \
            --skip-checks 2>&1 | tee deploy.log

      # Write the deploy-rs output into the target's journal, where Alloy
      # ships it to Loki as {host="<host>", app="deploy-rs"}. Done after the
      # deploy, not streamed, so a dropped SSH session during activation
      # can't break the deploy. The summary line is err on failure, so
      # failed deploys match {priority=~"[0-3]"}. Substitution noise
      # ("copying path ..." and the indented store path lists, over 95% of
      # the output) stays in the Actions log only.
      - name: Ship deploy log to Loki
        if: always() && steps.deploy.outcome != 'skipped'
        continue-on-error: true
        env:
          HOST: ${{ matrix.host }}
          OUTCOME: ${{ steps.deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVISION: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          priority=info
          [[ "$OUTCOME" == success ]] || priority=err
          if [[ -s deploy.log ]]; then
            sed -e 's/\x1b\[[0-9;]*m//g' -e '/^copying path /d' -e '/^  \/nix\/store\//d' deploy.log \
              | ssh "$HOST" systemd-cat -t deploy-rs -p info
          fi
          echo "deploy ${OUTCOME}: revision=${REVISION} actor=${ACTOR} run=${RUN_URL}" \
            | ssh "$HOST" systemd-cat -t deploy-rs -p "$priority"
